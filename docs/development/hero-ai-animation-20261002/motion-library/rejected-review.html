<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两类待复看的动作原片</title><style>
*{box-sizing:border-box}body{margin:0;background:#181b22;color:#eee7d6;font:16px/1.6 system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:26px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin:4px 0}p{color:#bcb7ac}a{color:#e8d49b}button{background:#30333a;color:#eee7d6;border:1px solid #706951;border-radius:8px;padding:9px 14px;cursor:pointer;margin:0 8px 8px 0;font:inherit}button.active{background:#68562f;border-color:#d5b770;color:#fff7db}.tabs{margin:24px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{min-width:0}h2{font-size:18px}video{display:block;width:100%;aspect-ratio:9/16;background:#dad8d3;border-radius:12px}small{color:#aea99d}.controls{position:sticky;top:0;background:#181b22ef;z-index:1;padding:12px 0}.action-title{font-size:20px;color:#ebd391;margin:14px 0 4px}.note{border:1px solid #514c3d;padding:14px 18px;border-radius:10px;margin:24px 0}.seek{display:flex;gap:12px;align-items:center;margin:8px 0}.seek input{width:min(100%,500px);min-width:0}.seek span,.seek small{white-space:nowrap}.seek input{flex:1}.downloads{margin-top:8px}.status{font-size:13px;color:#c2ac7e}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:18px 14px}.controls{position:static}header{display:block}}</style>
<main><header><div><small>保留原片 · 作者疑点供你判断</small><h1>这两类动作，你来看看</h1></div><a href="../review.html">查看第一轮试样</a></header><p>这里是我暂未选入的两类动作，每类三套原片。默认原速，可切到 ½ 慢放；重点看原片约 2–4 秒时，手掌与背部的遮挡关系。</p><div class="tabs" id="tabs"></div><div class="controls"><button onclick="restart()">从头一起播放</button><button onclick="pauseAll()">暂停</button><span id="speeds"></span><div class="seek"><span>逐段查看</span><input id="seek" type="range" min="0" max="1000" value="0" oninput="seekAll(this.value)"><small id="time">0.00 秒</small></div></div><div class="action-title" id="title"></div><p id="mapping"></p><div class="grid" id="grid"></div><div class="note">“未选入”是我的初筛判断，并不代表你的意见。两类原片均原样保留，没有删掉；这页方便你看完整动作。</div><p><a href="../review.html">返回第一轮试样</a></p><small id="status"></small></main>
<script>
let spec,selected=0,rate=1;const labels={'mistport-night':'雾港夜行','starlight-magician':'星辉术士','midnight-carnival':'午夜狂欢'};const videos=()=>[...document.querySelectorAll('video')];
function pauseAll(){videos().forEach(v=>v.pause())}function restart(){videos().forEach(v=>{v.currentTime=0;v.playbackRate=rate;v.play().catch(()=>{})})}function setRate(r){rate=r;videos().forEach(v=>v.playbackRate=r);document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===r))}function seekAll(t){pauseAll();videos().forEach(v=>{if(Number.isFinite(v.duration))v.currentTime=v.duration*t/1000})}
function choose(i){selected=i;const a=spec.actions[i];pauseAll();document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('active',Number(b.dataset.action)===i));document.querySelector('#title').textContent=(i+1)+' · '+a.title;document.querySelector('#mapping').textContent=a.observation;document.querySelector('#grid').innerHTML=spec.outfits.map(n=>'<article><h2>'+labels[n]+'</h2><video controls muted loop playsinline preload="metadata" poster="../'+n+'-input.png" src="'+a.id+'/'+n+'.mp4"></video><div class="downloads"><a href="'+a.id+'/'+n+'.mp4">原速视频</a></div></article>').join('');videos().forEach(v=>{v.playbackRate=rate;v.addEventListener('loadedmetadata',()=>v.playbackRate=rate)});videos()[0].addEventListener('timeupdate',()=>{const v=videos()[0];document.querySelector('#seek').value=v.currentTime/v.duration*1000||0;document.querySelector('#time').textContent=v.currentTime.toFixed(2)+' 秒'});document.querySelector('#seek').value=0}
fetch('rejected-actions.json').then(r=>r.json()).then(s=>{spec=s;document.querySelector('#tabs').innerHTML=s.actions.map((a,i)=>'<button data-action="'+i+'" onclick="choose('+i+')">'+(i+1)+' '+a.title+'</button>').join('');document.querySelector('#speeds').innerHTML=[0.25,0.5,1,2,3].map(r=>'<button data-rate="'+r+'" onclick="setRate('+r+')">×'+r+'</button>').join('');choose(0);setRate(1);document.querySelector('#status').textContent=s.actions.length+' 类动作 × '+s.outfits.length+' 套衣装 · 原速文件未改';});
</script></html>
