<header><h1>米色纸面铺到底</h1><p>柜台和正文页面的米色纸面延伸到屏幕底部，覆盖底部安全区。标题栏、返回按钮和场景画保持原样，日刊与附刊也使用连续纸面。</p><p>以下 28 张是正式 SwiftUI 页面在独立 iPhone 13 模拟器中的原样截图：20 张首屏、8 张滚到底。没有后期补色，未安装到真实手机。滚到底通过隔离 DEBUG 参数定位，没有模拟手动手势。此宿主没有 Unity。</p><p><a href="README.md">范围与验证</a> · <a href="paper-validation.json">新版构建与截图记录</a> · <a href="review.html">首轮返回按钮历史截图</a></p></header>
