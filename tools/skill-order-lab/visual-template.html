<div id="mistport-order-lab">
  <style>
    #mistport-order-lab { color:var(--foreground); }
    #mistport-order-lab .slots { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0; }
    #mistport-order-lab .slot { display:flex;flex-direction:column;gap:6px;min-width:0; }
    #mistport-order-lab .measure { display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px; }
    #mistport-order-lab .outcomes { display:flex;flex-wrap:wrap;gap:16px;margin:14px 0; }
    #mistport-order-lab .detail { min-height:3em;margin:10px 0; }
    #mistport-order-lab .best { overflow-wrap:anywhere;margin:12px 0; }
    #mistport-order-lab h3 { padding-right:92px; }
    @media(max-width:560px) { #mistport-order-lab .slots { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
  <h3>四张牌，换个顺序</h3>
  <div class="text-small text-muted">候选数值 · 攻击 100 · 尚未接入手机</div>
  <div class="viz-controls">
    <label class="form-label">敌人类型<select class="form-select" data-profile></select></label>
  </div>
  <div class="slots" aria-label="从左到右按序循环施法"></div>
  <div class="viz-row">
    <button type="button" class="btn" data-swap>交换第 2、3 张</button>
    <button type="button" class="btn btn-primary" data-best>使用本组最快达标顺序</button>
  </div>
  <div class="detail text-small" data-detail></div>
  <div aria-live="polite" aria-atomic="true">
    <div class="measure"><span>当前顺序 · 前 7 秒伤害</span><span class="tabular-nums" data-damage></span></div>
    <div class="progress" role="progressbar" aria-label="当前顺序前7秒伤害" aria-valuemin="0" data-current-bar><div class="progress-bar"></div></div>
    <div class="measure"><span>对照顺序 · 前 7 秒伤害</span><span class="tabular-nums" data-reference></span></div>
    <div class="progress" role="progressbar" aria-label="对照顺序前7秒伤害" aria-valuemin="0" data-best-bar><div class="progress-bar"></div></div>
    <div class="outcomes tabular-nums"><span data-outcome></span><span data-count></span><span data-hits></span></div>
  </div>
  <div class="text-small best" data-best-order></div>
  <div class="text-small text-muted" data-profile-detail></div>
  <script>
  (()=>{
    __MODEL__
    const root=document.getElementById('mistport-order-lab');
    const $=s=>root.querySelector(s);
    const defaultOrder=['step','barrage','fuse','haste'];
    let order=[...defaultOrder],profileID='duel',selected='step',bestOrder=[...defaultOrder];
    const slots=$('.slots');
    for(let i=0;i<4;i++){
      const label=document.createElement('label');label.className='slot form-label';
      const title=document.createElement('span');title.textContent=`第 ${i+1} 张`;
      const select=document.createElement('select');select.className='form-select';select.setAttribute('aria-label',`第${i+1}张牌`);
      for(const c of CARDS){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.append(o);}
      label.append(title,select);slots.append(label);
      select.addEventListener('change',()=>{
        const next=select.value,existing=order.indexOf(next),old=order[i];
        if(existing!==-1)order[existing]=old;
        order[i]=next;selected=next;render();save();
      });
      select.addEventListener('focus',()=>{selected=order[i];showDetail();});
    }
    const picker=$('[data-profile]');
    for(const p of PROFILES){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;picker.append(o);}
    picker.addEventListener('change',()=>{profileID=picker.value;render();save();});
    $('[data-swap]').addEventListener('click',()=>{[order[1],order[2]]=[order[2],order[1]];render();save();});
    $('[data-best]').addEventListener('click',()=>{order=[...bestOrder];render();save();});
    function showDetail(){const c=BY_ID[selected]??BY_ID[order[0]];$('[data-detail]').textContent=`${c.name} · ${c.text}`;}
    function bar(selector,value,max){const e=$(selector);e.setAttribute('aria-valuenow',value);e.setAttribute('aria-valuemax',max);e.firstElementChild.style.width=`${value/max*100}%`;}
    function render(){
      picker.value=profileID;
      root.querySelectorAll('.slot select').forEach((e,i)=>{e.value=order[i];});
      const profile=PROFILES.find(p=>p.id===profileID),r=simulate(order,profile),opening=simulate(order,profile,{maxTime:7000});
      const variants=permutations(order).map(o=>simulate(o,profile));
      const wins=variants.filter(x=>x.cleared).sort((a,b)=>a.ms-b.ms||b.heroHP-a.heroHP||a.order.join(',').localeCompare(b.order.join(',')));
      const best=wins[0]??variants.sort((a,b)=>b.damage-a.damage||a.ms-b.ms)[0];bestOrder=[...best.order];
      const ref=simulate(best.order,profile,{maxTime:7000}),ceiling=Math.max(1,ref.damage,opening.damage);
      $('[data-damage]').textContent=opening.damage+' 点';$('[data-reference]').textContent=ref.damage+' 点';
      bar('[data-current-bar]',opening.damage,ceiling);bar('[data-best-bar]',ref.damage,ceiling);
      $('[data-outcome]').textContent=r.cleared?`演算达标 · ${(r.ms/1000).toFixed(2)} 秒`:`模型未达标 · 敌方剩余 ${r.remaining} 生命`;
      $('[data-count]').textContent=`本组有效顺序 ${wins.length} / 24`;
      $('[data-hits]').textContent=`首 7 秒爆炸记录 ${opening.fusesHit} 次命中`;
      $('[data-best]').textContent=wins.length?'使用本组最快达标顺序':'使用本组最高伤害顺序';
      $('[data-best-order]').textContent=`对照：${best.order.map(id=>BY_ID[id].name).join(' → ')}`;
      $('[data-profile-detail]').textContent=`${profile.hp.length} 个目标 · 总生命 ${profile.hp.reduce((a,b)=>a+b,0)} · 护甲 ${Math.round(profile.armor*100)}% · 演算上限 45 秒`;
      showDetail();
    }
    function save(){window.openai?.setWidgetState?.({modelContent:{order:order.map(id=>BY_ID[id].name),profile:profileID,candidateOnly:true},privateContent:{order,profileID,selected}})?.catch(()=>{});}
    function restore(state){
      const s=state?.privateContent;
      if(s&&Array.isArray(s.order)&&s.order.length===4&&new Set(s.order).size===4&&s.order.every(id=>BY_ID[id]))order=[...s.order];
      if(PROFILES.some(p=>p.id===s?.profileID))profileID=s.profileID;
      if(BY_ID[s?.selected])selected=s.selected;
      render();
    }
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
    restore(window.openai?.widgetState);
  })();
  </script>
</div>
