<!doctype html><meta charset="utf-8"><title>记忆蛭 · 动作预览</title><style>body{margin:0;background:#253141;color:#eee;font:16px system-ui}nav{position:absolute;bottom:24px;left:20px;display:flex;gap:12px}button{padding:12px}h3{position:absolute;left:20px}canvas{display:block}</style><h3>记忆蛭 · 虫形动作初稿（拖动旋转）</h3><nav></nav><script type="importmap">{"imports":{"three":"../../mistport-ios/Mistport/WisteriaMap/three.module.js","three/addons/":"../../mistport-ios/Mistport/WisteriaMap/addons/"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const s=new T.Scene();s.background=new T.Color('#253141');const c=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);c.position.set(1,1.2,1.8);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);const pmrem=new T.PMREMGenerator(r);s.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;document.body.append(r.domElement);const ctrl=new OrbitControls(c,r.domElement);s.add(new T.HemisphereLight(0xffffff,0x48556c,2));const l=new T.DirectionalLight(0xffffff,3);l.position.set(2,4,3);s.add(l);let mixer,active;const clock=new T.Clock();new GLTFLoader().load('MemoryLeech-rigged.glb?v=3',g=>{s.add(g.scene);mixer=new T.AnimationMixer(g.scene);for(const clip of g.animations){const b=document.createElement('button');b.textContent=({Idle:'待机',Crawl:'蠕动',Cast:'施法',Hit:'受击',Death:'死亡'})[clip.name]||clip.name;b.onclick=()=>{if(active)active.stop();active=mixer.clipAction(clip);active.reset();active.setLoop(['Idle','Crawl'].includes(clip.name)?T.LoopRepeat:T.LoopOnce,Infinity);active.clampWhenFinished=true;active.play()};document.querySelector('nav').append(b);if(!active)b.click()}});r.setAnimationLoop(()=>{const dt=clock.getDelta();mixer?.update(dt);ctrl.update();r.render(s,c)});onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script>
